<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EQARY — Interactive App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#15170f;--ink-soft:#5a5c52}
  *{box-sizing:border-box}
  html,body{margin:0}
  /* embed canvas — change or remove background to suit your page */
  body{font-family:'Hanken Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#eef0f4;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px}
  /* device frame */
  .phone{position:relative;width:300px;max-width:86vw;aspect-ratio:540/960;border-radius:42px;padding:11px;background:linear-gradient(160deg,#272336,#16131f);box-shadow:0 40px 90px rgba(20,16,40,.4),inset 0 1px 0 rgba(255,255,255,.08)}
  /* persona switch */
  .persona-tabs{display:inline-flex;gap:5px;background:#fff;border:1px solid #e6e6f0;border-radius:999px;padding:5px;box-shadow:0 6px 20px rgba(20,18,50,.10)}
  .persobtn{border:none;background:none;cursor:pointer;font-family:inherit;font-size:.92rem;font-weight:600;color:#6c6b86;padding:10px 20px;border-radius:999px;transition:.2s}
  .persobtn.on{background:#4f46e5;color:#fff}
  .phone-hint{font-size:.85rem;color:#6c6b86;letter-spacing:.01em}
/* ===== interactive prototype (EQARY app) ===== */
  .phone{position:relative;width:300px}
  .app-copy{align-self:center}
  .phone-col{display:flex;flex-direction:column;align-items:center;gap:14px}
  .phone-hint{font-size:.85rem;color:var(--ink-soft);letter-spacing:.01em}
  .phone-screen{position:absolute;inset:11px;border-radius:32px;overflow:hidden;background:#f4f5f9;z-index:2}
  .ps{position:absolute;inset:11px;border-radius:32px;overflow:hidden;background:#f4f5f9;color:#1a1830;display:flex;flex-direction:column;font-family:'Hanken Grotesk',sans-serif;z-index:2}
  .ps.ind{background:#1b1830;color:#fff}
  .ps *{box-sizing:border-box}
  .ps-body{flex:1;overflow-y:auto}
  .ps-body::-webkit-scrollbar{width:0}
  .sb{padding:14px 15px 14px}
  .hdr{display:flex;align-items:center;gap:10px;padding:15px 15px 8px;background:#1b1830;color:#fff}
  .hdr .bk{border:none;background:none;font-size:25px;line-height:.7;cursor:pointer;color:#fff;width:16px;padding:0}
  .hdr b{font-size:15px;font-weight:700}
  .lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9a99b3;margin:14px 0 9px}
  .ps-center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px 20px}
  .ps-logo{width:66px;height:66px;border-radius:18px;background:linear-gradient(160deg,#2a2550,#4f46e5);display:grid;place-items:center}
  .ps-h1{font-size:30px;font-weight:300;letter-spacing:.12em;color:#fff}
  .ps-sub{font-size:13px;line-height:1.5;color:#b9b6e0;max-width:25ch}
  .ps-h2{font-size:18px;font-weight:600;line-height:1.18;margin:4px 0 8px}
  .ps-h2 b{font-weight:800}
  .ps-p{font-size:12.5px;line-height:1.5;color:#6c6b86;margin-bottom:12px}
  .ps-back{border:none;background:none;font-size:26px;line-height:.8;cursor:pointer;color:#1b1830;width:20px;padding:0}
  .pp{font-size:12.5px;color:#6c6b86;line-height:1.5}
  .ab{border:none;border-radius:13px;padding:14px;font-family:inherit;font-size:14px;font-weight:600;color:#fff;background:#4f46e5;cursor:pointer;width:100%;transition:transform .12s,background .2s}
  .ab:active{transform:scale(.98)}
  .ab:hover{background:#4338ca}
  .ab.dis{background:#cdcde0;color:#83839c;pointer-events:none}
  .ab.gho{background:#fff;color:#1b1830;border:1px solid rgba(20,18,50,.14)}
  .ab.gho:hover{background:#eef0fe}
  .ab.sm{padding:13px 10px;font-size:13px}
  .icobtn{flex:none;width:48px;border-radius:13px;background:#fff;border:1px solid rgba(20,18,50,.14);display:grid;place-items:center;cursor:pointer}
  .icobtn svg{width:18px;height:18px;stroke:#1b1830;fill:none;stroke-width:1.9}
  .ps-foot{flex:none;padding:11px 15px 16px;display:flex;gap:8px;background:#fff;border-top:1px solid rgba(20,18,50,.06)}
  .uaebtn{display:flex;align-items:center;justify-content:center;gap:9px;border:none;border-radius:13px;padding:14px 18px;font-family:inherit;font-size:14px;font-weight:600;color:#1b1830;background:#fff;cursor:pointer}
  .uaebtn .udot{width:18px;height:18px;border-radius:5px;background:#4f46e5}
  .apphead{background:#1b1830;color:#fff;padding:16px 15px 15px}
  .apphead .brand{display:flex;align-items:center;justify-content:space-between}
  .apphead .brand b{font-size:15px;font-weight:800;letter-spacing:.04em}
  .apphead .tag{font-size:10.5px;color:#b9b6e0;margin-top:1px}
  .apphead .bell{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.1);display:grid;place-items:center}
  .apphead .htitle{font-size:18px;font-weight:600;margin-top:13px}
  .seg{display:flex;gap:6px;background:rgba(255,255,255,.08);border-radius:12px;padding:4px;margin-top:13px}
  .segb{flex:1;border:none;background:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:#cfcdee;padding:9px;border-radius:9px}
  .segb.on{background:#fff;color:#1b1830}
  .searchbar{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);border-radius:11px;padding:11px 13px;margin-top:10px;color:#b9b6e0;font-size:12px}
  .searchbar svg{width:16px;height:16px;stroke:#b9b6e0;fill:none;stroke-width:2}
  .lc{background:#fff;border-radius:16px;overflow:hidden;border:1px solid rgba(20,18,50,.06);box-shadow:0 6px 18px rgba(30,20,60,.06);margin-bottom:13px;cursor:pointer;width:100%;text-align:left;font-family:inherit;display:block;padding:0}
  .lc .img{display:block;height:120px;position:relative}
  .lc .tagrow{position:absolute;left:9px;top:9px;display:flex;gap:6px}
  .ltag{font-size:10px;font-weight:700;padding:4px 8px;border-radius:7px;color:#fff}
  .ltag.sale{background:#4f46e5}
  .ltag.rent{background:#1b1830}
  .heart{position:absolute;right:9px;top:9px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
  .heart svg{width:15px;height:15px;stroke:#1b1830;fill:none;stroke-width:1.8}
  .lc .bd{display:block;padding:12px 13px 13px}
  .vrf{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:#16a34a;background:#e7f7ec;border-radius:6px;padding:3px 7px;margin-bottom:7px}
  .lc .ttl{display:block;font-size:14px;font-weight:600;line-height:1.2}
  .lc .loc{display:block;font-size:11.5px;color:#6c6b86;margin-top:2px}
  .lc .pr{display:block;font-size:17px;font-weight:800;color:#1a1830;margin-top:8px}
  .lc .pr small{font-size:11px;font-weight:600;color:#9a99b3}
  .specs{display:flex;gap:14px;margin-top:9px;color:#6c6b86;font-size:11px}
  .save{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;font-weight:700;color:#16a34a;background:#e7f7ec;border-radius:8px;padding:7px 10px}
  .dhero{height:172px;position:relative}
  .dback{position:absolute;left:10px;top:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;border:none;cursor:pointer}
  .dback svg{width:17px;height:17px;stroke:#1b1830;fill:none;stroke-width:2.2}
  .pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
  .pill2{font-size:10px;font-weight:700;border-radius:7px;padding:4px 8px}
  .pill2.v{color:#16a34a;background:#e7f7ec}
  .pill2.r{color:#4f46e5;background:#eef0fe}
  .dtitle{font-size:18px;font-weight:700;line-height:1.18}
  .dloc{font-size:12px;color:#6c6b86;margin-top:3px}
  .dprice{font-size:22px;font-weight:800;margin-top:10px}
  .dprice small{font-size:12px;font-weight:600;color:#9a99b3}
  .statrow{display:flex;gap:8px;margin:13px 0}
  .stat3{flex:1;background:#fff;border:1px solid rgba(20,18,50,.07);border-radius:12px;padding:11px 6px;text-align:center}
  .stat3 b{font-size:15px;font-weight:700;display:block}
  .stat3 span{font-size:10px;color:#6c6b86}
  .about{font-size:12.5px;line-height:1.55;color:#56546e}
  .slot{display:flex;align-items:center;gap:11px;border:1px solid rgba(20,18,50,.1);background:#fff;border-radius:13px;padding:13px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;width:100%;text-align:left;margin-bottom:9px}
  .slot .rad{width:18px;height:18px;border-radius:50%;border:2px solid #c4c3d6;flex:none}
  .slot.sel{border-color:#4f46e5;background:#eef0fe}
  .slot.sel .rad{border-color:#4f46e5;background:radial-gradient(circle,#4f46e5 42%,transparent 46%)}
  .keybox{background:#1b1830;color:#fff;border-radius:14px;padding:17px;text-align:center;margin-bottom:13px}
  .keybox span{font-size:11px;color:#b9b6e0}
  .keybox .code{font-size:27px;font-weight:800;letter-spacing:.2em;margin:5px 0}
  .okrow{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#16a34a;font-weight:600;margin-bottom:12px}
  .okc{width:20px;height:20px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
  .okc.big{width:46px;height:46px;font-size:24px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
  .chip{font-size:11px;font-weight:600;color:#4f46e5;background:#eef0fe;border-radius:8px;padding:6px 10px}
  .pcard{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid rgba(20,18,50,.07);border-radius:13px;padding:10px;margin:10px 0}
  .pcard .pth{width:50px;height:50px;border-radius:11px;flex:none}
  .pcard b{font-size:13px;font-weight:600;display:block}
  .pcard span{font-size:11px;color:#6c6b86}
  .togrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid rgba(20,18,50,.07);border-radius:13px;padding:13px;margin-bottom:9px}
  .togrow .tt b{font-size:13px;font-weight:600;display:block}
  .togrow .tt span{font-size:11px;color:#6c6b86}
  .tog{width:42px;height:25px;border-radius:999px;background:#d4d3e2;position:relative;flex:none;cursor:pointer;transition:.2s}
  .tog::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}
  .tog.on{background:#4f46e5}
  .tog.on::after{left:20px}
  .bankr{display:flex;align-items:center;gap:11px;border:1px solid rgba(20,18,50,.1);background:#fff;border-radius:13px;padding:13px;cursor:pointer;font-family:inherit;width:100%;text-align:left;margin-bottom:9px;font-size:13.5px;font-weight:600;color:#1a1830}
  .bankr .blogo{width:34px;height:34px;border-radius:9px;background:#eef0fe;color:#4f46e5;display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
  .bankr .rad{margin-left:auto;display:flex}
  .bankr.sel{border-color:#4f46e5;background:#eef0fe}
  .summary{background:#fff;border:1px solid rgba(20,18,50,.07);border-radius:14px;padding:2px 14px;margin:6px 0 13px}
  .srow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid rgba(20,18,50,.06);font-size:12.5px;color:#6c6b86}
  .srow:first-child{border-top:none}
  .srow b{color:#1a1830;font-weight:700;text-align:right}
  .srow.tot b{color:#4f46e5;font-size:16px}
  .busybox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px 12px;font-size:12.5px;color:#6c6b86}
  .spin{width:20px;height:20px;border:2px solid rgba(79,70,229,.2);border-top-color:#4f46e5;border-radius:50%;display:inline-block;animation:psp .7s linear infinite}
  @keyframes psp{to{transform:rotate(360deg)}}
  .bigcheck{width:76px;height:76px;border-radius:50%;background:#4f46e5;display:grid;place-items:center;animation:pop .4s ease}
  .bigcheck svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  @keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
  .lphoto{display:block;height:96px;position:relative;border-radius:12px}
  .lphoto.big{height:150px;border-radius:14px}
  .navbar{flex:none;display:flex;background:#fff;border-top:1px solid rgba(20,18,50,.07)}
  .nbtn{flex:1;border:none;background:none;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 13px;color:#9a99b3;font-size:9px;font-weight:600}
  .nbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nbtn.on{color:#4f46e5}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:#9a99b3;padding:54px 24px;font-size:12.5px;line-height:1.5}
  .empty svg{width:34px;height:34px;stroke:#c4c3d6;fill:none;stroke-width:1.5}
  .faceov{position:absolute;inset:0;background:rgba(20,18,48,.95);display:flex;align-items:center;justify-content:center;color:#fff;z-index:5}
  .faceov .facebox{display:flex;flex-direction:column;align-items:center;gap:16px}
  .faceov span{font-size:13px;font-weight:600}
  .facering{width:118px;height:118px;border-radius:28px;border:2px solid rgba(124,116,240,.6);display:grid;place-items:center;position:relative;overflow:hidden}
  .facering svg{stroke:#a5a0f5;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .facescan{position:absolute;left:0;right:0;height:3px;background:#7c74f0;box-shadow:0 0 14px #7c74f0;animation:scan 1.1s ease-in-out infinite}
  @keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
  .faceov.ok .facescan{display:none}

  
/* ===== seller app (indigo) ===== */
  .sbody{padding:14px 15px 12px}
  .ps-app-head{display:flex;align-items:center;justify-content:space-between;padding:2px 0 12px}
  .ps-app-head b{font-size:16px;font-weight:700}
  .ps-app-head .owner{font-size:9.5px;color:#4f46e5;font-weight:800;letter-spacing:.1em;border:1px solid rgba(79,70,229,.35);border-radius:6px;padding:3px 7px}
  .ps-app-sub{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#9a99b3;margin:8px 0 10px}
  .ps-tabbar{flex:none;display:flex;border-top:1px solid rgba(20,18,50,.07);background:#fff}
  .tbtn{flex:1;border:none;background:none;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 13px;color:#9a99b3;font-size:9px;font-weight:600}
  .tbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tbtn.on{color:#4f46e5}
  .sstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
  .sstat{background:#fff;border:1px solid rgba(20,18,50,.07);border-radius:12px;padding:11px 12px}
  .sstat .v{font-size:17px;font-weight:800;color:#1a1830;line-height:1}
  .sstat .v small{font-size:10px;color:#9a99b3;font-weight:600}
  .sstat .k{font-size:10.5px;color:#6c6b86;margin-top:5px}
  .schart{background:#fff;border:1px solid rgba(20,18,50,.07);border-radius:12px;padding:13px;margin-bottom:12px}
  .schart .ct{font-size:11px;color:#6c6b86;font-weight:600;margin-bottom:11px;display:flex;justify-content:space-between}
  .bars{display:flex;gap:7px;height:80px;align-items:flex-end}
  .barcol{flex:1;height:100%;display:flex;flex-direction:column;gap:5px}
  .bar{width:100%;flex:1;background:#ecebfb;border-radius:5px 5px 0 0;position:relative}
  .bar i{position:absolute;left:0;right:0;bottom:0;background:#4f46e5;border-radius:5px 5px 0 0}
  .blab{font-size:9px;color:#9a99b3;text-align:center}
  .prop{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid rgba(20,18,50,.07);border-radius:13px;padding:10px;margin-bottom:9px;width:100%;text-align:left;font-family:inherit;cursor:pointer}
  .prop .pth{width:46px;height:46px;border-radius:10px;flex:none}
  .prop .pm{flex:1;min-width:0}
  .prop .pm b{font-size:13px;font-weight:600;display:block}
  .prop .pm span{font-size:11px;color:#6c6b86}
  .pstatus{font-size:9.5px;font-weight:700;padding:4px 8px;border-radius:7px;flex:none}
  .pstatus.occ{background:#e7f7ec;color:#16a34a}
  .pstatus.vac{background:#fdeceb;color:#d2564b}
  .pstatus.lst{background:#eef0fe;color:#4f46e5}
  .ybadge{font-size:12px;font-weight:800;color:#4f46e5;background:#eef0fe;border-radius:8px;padding:5px 9px;flex:none}
  .conv{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid rgba(20,18,50,.07);border-radius:13px;padding:11px;margin-bottom:9px;cursor:pointer;width:100%;text-align:left;font-family:inherit}
  .conv .ava{width:38px;height:38px;border-radius:50%;background:#eef0fe;color:#4f46e5;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
  .conv .cm{flex:1;min-width:0}
  .conv .cm b{font-size:13px;font-weight:600;display:block}
  .conv .cm span{font-size:11px;color:#6c6b86;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .dot{width:8px;height:8px;border-radius:50%;background:#4f46e5;flex:none}
  .thread{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .bub{max-width:82%;padding:9px 12px;border-radius:14px;font-size:12.5px;line-height:1.4}
  .bub.them{align-self:flex-start;background:#fff;border:1px solid rgba(20,18,50,.07);border-bottom-left-radius:5px}
  .bub.me{align-self:flex-end;background:#4f46e5;color:#fff;border-bottom-right-radius:5px}
  .quicks{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .qchip{border:1px solid #d0cfee;background:#fff;color:#4f46e5;border-radius:999px;padding:8px 13px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .mcat{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}
  .mcatb{background:#fff;border:1px solid rgba(20,18,50,.07);border-radius:13px;padding:14px;cursor:pointer;font-family:inherit;text-align:left}
  .mcatb .ic2{width:34px;height:34px;border-radius:9px;background:#eef0fe;display:grid;place-items:center;margin-bottom:9px}
  .mcatb .ic2 svg{width:18px;height:18px;stroke:#4f46e5;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .mcatb b{font-size:13px;font-weight:600;display:block}
  .mcatb span{font-size:10.5px;color:#6c6b86}
  .mprov{background:#fff;border:1px solid rgba(20,18,50,.07);border-radius:12px;padding:12px 14px;margin:4px 0 14px}
  .mprov b{font-size:13px;font-weight:600;display:block}
  .mprov span{font-size:11px;color:#6c6b86}
  .mstep{display:flex;flex-direction:column}
  .mstepi{display:flex;gap:11px;align-items:flex-start;padding-bottom:16px;position:relative}
  .mstepi::before{content:"";position:absolute;left:9px;top:21px;bottom:-3px;width:2px;background:#e4e3f0}
  .mstepi:last-child::before{display:none}
  .mstepi .md{width:20px;height:20px;border-radius:50%;border:2px solid #c8c7da;background:#fff;flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
  .mstepi.done .md{background:#4f46e5;border-color:#4f46e5}
  .mstepi.cur .md{border-color:#4f46e5}
  .mstepi .mt b{font-size:12.5px;font-weight:600;display:block}
  .mstepi .mt span{font-size:10.5px;color:#6c6b86}
  
/* ===== landlord hub (in profile) ===== */
  .statline{display:flex;gap:8px;margin:12px 0 4px}
  .slcard{flex:1;background:#fff;border:1px solid rgba(20,18,50,.07);border-radius:12px;padding:11px 6px;text-align:center}
  .slcard b{font-size:15px;font-weight:800;display:block}

  function buyerAction(act){
    const i=act.indexOf(':'), c=i<0?act:act.slice(0,i), a=i<0?'':act.slice(i+1);
    switch(c){
      case 'noop': break;
      case 'login': faceScan(()=>{B.verified=true;B.screen='home';renderApp();}); break;
      case 'mode': B.mode=a; renderApp(); break;
      case 'nav': B.screen=(a==='explore'?'home':a); renderApp(); break;
      case 'open': B.listing=rentList.concat(buyList).find(x=>x.id===a); B.booked=false; B.applied=false; B.busy=false; B.bank=null; B.escrow=true; B.esign=true; B.slot=0; B.screen='listing'; renderApp(); break;
      case 'back': B.screen='listing'; B.busy=false; renderApp(); break;
      case 'viewing': B.screen='viewing'; renderApp(); break;
      case 'slot': B.slot=+a; renderApp(); break;
      case 'bookview': B.booked=true; renderApp(); break;
      case 'apply': B.screen='apply'; B.busy=false; B.applied=false; renderApp(); break;
      case 'submitapply': B.busy=true; renderApp(); setTimeout(()=>{B.busy=false;B.applied=true;renderApp();},1500); break;
      case 'signlease': faceScan(()=>{B.screen='rentdone';renderApp();}); break;
      case 'offer': B.screen='offer'; renderApp(); break;
      case 'tog': if(a==='escrow'){B.escrow=!B.escrow;}else{B.esign=!B.esign;} renderApp(); break;
      case 'tobank': B.screen='connectbank'; B.busy=false; renderApp(); break;
      case 'bank': B.bank=+a; renderApp(); break;
      case 'authorise': B.busy=true; renderApp(); setTimeout(()=>{B.busy=false;B.screen='offerdone';renderApp();},1500); break;
      case 'home': B.screen='home'; B.busy=false; renderApp(); break;
      case 'go': B.screen=a; renderApp(); break;
      case 'dash': B.dash=a; renderApp(); break;
      case 'cl': if(a==='maid'){B.cl.maid=!B.cl.maid;}else if(a==='pool'){B.cl.pool=!B.cl.pool;}else if(a==='verify'){B.cl.verified=true;}else if(a==='create'){B.cl.created=true;B.screen='mylistings';} renderApp(); break;
      case 'offtab': B.offerTab=a; renderApp(); break;
      case 'acc': B.offers[a]='a'; renderApp(); break;
      case 'dec': B.offers[a]='d'; renderApp(); break;
      case 'signout': B.screen='login'; B.verified=false; renderApp(); break;
    }
  }

  }
  function sBuyList(){
    return `<div class="ps-app-head"><b>Grow your portfolio</b><span class="owner">INVEST</span></div><p class="pp" style="margin-bottom:12px">Owners buy here too, off-plan and secondary, scored by yield.</p>${sBuy.map(b=>`<button class="prop" data-act="s:buy:${b.id}"><span class="pth" style="background:linear-gradient(150deg,${b.c1},${b.c2})"></span><span class="pm"><b>${b.t}</b><span>${b.dev} &middot; ${money(b.price)}</span></span><span class="ybadge">${b.yld}</span></button>`).join('')}`;
  }
  function sBuyDetail(){
    const b=sBuy.find(x=>x.id===SS.buySel);
    return `<div class="ps-app-head"><button class="ps-back" data-act="s:buyback">&lsaquo;</button><b style="font-size:14px">${b.t}</b><span style="width:18px"></span></div><span class="lphoto big" style="background:linear-gradient(150deg,${b.c1},${b.c2})"></span><div class="ps-h2" style="margin-top:12px;font-size:17px">${b.t}</div><p class="ps-p" style="margin-bottom:8px">${b.dev}</p><div class="sstats"><div class="sstat"><div class="v">${money(b.price)}</div><div class="k">Price</div></div><div class="sstat"><div class="v">${b.yld}</div><div class="k">Projected net yield</div></div></div>${SS.expressed===b.id?`<div class="okrow" style="margin-top:12px"><span class="okc">&#10003;</span> Interest sent. EQARY will line up the reservation.</div>`:`<button class="ab" style="margin-top:12px" data-act="s:express:${b.id}">Express interest</button>`}`;
  }
  function maintRun(){
    if(persona!=='seller'||SS.tab!=='maint'||SS.maint==null) return;
    if(SS.maintStatus<mstages.length){SS.maintStatus++;renderApp();setTimeout(maintRun,1100);}
  }
  function sellerAction(p){
    const a=p[0],b=p[1];
    if(a==='tab'){SS.tab=b;SS.thread=null;SS.buySel=null;renderApp();}
    else if(a==='thread'){SS.thread=b;renderApp();}
    else if(a==='back'){SS.thread=null;renderApp();}
    else if(a==='send'){const c=sConvs.find(x=>x.id===SS.thread);SS.msgs[c.id]=SS.msgs[c.id]||[];SS.msgs[c.id].push(['me',sQuick[+b]]);renderApp();setTimeout(()=>{SS.msgs[c.id].push(['them','Perfect, done &#10003;']);if(persona==='seller'&&SS.tab==='messages'&&SS.thread===c.id)renderApp();},900);}
    else if(a==='maint'){SS.maint=b;SS.maintStatus=1;renderApp();setTimeout(maintRun,1000);}
    else if(a==='maintreset'){SS.maint=null;SS.maintStatus=0;renderApp();}
    else if(a==='buy'){SS.buySel=b;renderApp();}
    else if(a==='buyback'){SS.buySel=null;renderApp();}
    else if(a==='express'){SS.expressed=b;renderApp();}
  }

  function renderApp(){ persona==='seller'?renderSeller():renderBuyer(); }

  screen.addEventListener('click',e=>{
    const btn=e.target.closest('[data-act]'); if(!btn) return;
    const act=btn.dataset.act; if(!act) return;
    if(act.slice(0,2)==='s:'){ sellerAction(act.split(':').slice(1)); return; }
    if(act.slice(0,2)==='b:'){ buyerAction(act.slice(2)); return; }
  });

  const hintEl=document.getElementById('phoneHint');
  document.querySelectorAll('.persobtn').forEach(b=>b.addEventListener('click',()=>{
    persona=b.dataset.persona;
    document.querySelectorAll('.persobtn').forEach(x=>x.classList.toggle('on',x===b));
    if(persona==='seller'){SS.tab='portfolio';SS.thread=null;SS.buySel=null;SS.maint=null;SS.maintStatus=0;if(hintEl)hintEl.textContent='Four tabs, tap around the dashboard';}
    else{B.screen='login';B.mode='rent';if(hintEl)hintEl.innerHTML='Tap through it &mdash; it&rsquo;s live';}
    renderApp();
  }));

  renderApp();
})();

  </script>
</body>
</html>
